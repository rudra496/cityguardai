src:
  - changed-files:
      - any-glob-to-any-file:
          - "app/**"
          - "components/**"
          - "lib/**"
styles:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.css"
public:
  - changed-files:
      - any-glob-to-any-file: "public/**"
documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "docs/**"
ci:
  - changed-files:
      - any-glob-to-any-file: ".github/workflows/**"
